name: Update reading and deploy

on:
  schedule:
    # WastewaterSCAN refreshes its data file overnight (around 11:30pm ET);
    # rebuild each morning at about 6:30am ET. GitHub may start it a little late.
    - cron: "30 10 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest Portland reading into the page
        run: python3 update.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
