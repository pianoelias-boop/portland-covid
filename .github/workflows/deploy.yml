name: Update reading and deploy

on:
  schedule:
    # WastewaterSCAN refreshes its data file overnight (around 11:30pm ET);
    # rebuild each morning at about 6:30am ET. GitHub may start it a little late.
    - cron: "30 10 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # If WastewaterSCAN can't be reached, skip the deploy (the site keeps its last
      # good reading) without failing the run, so GitHub doesn't send a failure email.
      - name: Pull latest Portland reading into the page
        id: update
        continue-on-error: true
        run: python3 update.py
      - name: Note skipped update
        if: steps.update.outcome != 'success'
        run: echo "::warning::Couldn't get the latest WastewaterSCAN reading; the site keeps its previous version."
      - if: steps.update.outcome == 'success'
        uses: actions/configure-pages@v6
      - if: steps.update.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        if: steps.update.outcome == 'success'
        uses: actions/deploy-pages@v5
